# The Coen Lab's data dictionary: what a rig's devices, logs, experiment settings and trial columns
# may be called, and each trial column's type, unit, values and former names. One file for every rig, so the same thing has the same name wherever it is
# recorded. Change it by commit: scripts\push.ps1 then rechecks every lab workflow against it.
#
# Who reads it:
#   - scripts\check-bonsai.ps1 fails a workflow that uses a name not here (device subjects and
#     log names, ExperimentControl parameters, BonsaiData_Trial columns), so update-workflows does
#     not update it and reports why.
#   - rig-setup's machines window marks each key of a rig's rig.yml against its rig's devices
#     and settings (update-workflows writes this file as JSON to K:\config\data-dictionary.json).
#   - open_rigs.trials reads BonsaiData_Trial by the columns here: old names through formerly,
#     each column as its type, codes decoded through values.
#
# Naming rules:
#   - A device is Kind-Instance, both PascalCase, with an instance even where a rig has one
#     (BehaviorBoard-Main), so a second never renames the first. A hyphen, never an underscore:
#     FormatFileName takes a device's folder from its name up to the first underscore.
#     In rig.yml the kind is a camelCase group with the instances inside (camera: face:).
#   - Experiment settings (ExperimentControl parameters) are PascalCase, as the controller shows them.
#   - Trial columns are camelCase. A time on the Harp clock ends in Time and is in seconds
#     (stimulusOnsetTime); a duration ends in its unit (itiSeconds), as does any other quantity
#     with a unit (rewardSizeUl). Seconds, the row's own Harp time, is the one exception. Never
#     store a latency (derive it from two times); if one is ever stored, it ends in Seconds,
#     never Time.
#   - The trial row holds two times, stimulusOnsetTime and choiceTime, besides Seconds. Licks,
#     spout moves, water (RewardDelivered) and the physical onset stay in the hardware and async
#     logs, matched to trials by time when read.
#   - A setting that is the same for the whole experiment is not a trial column: the manifest has
#     the settings at Go and TaskSchema the task as run (the task file with the controller's
#     overrides applied).
#   - A column two rigs write is a lab-wide one, never two rigs' own.
#
# Each trial column: type (int, double, bool or string; check-bonsai compares the record's
# member type), unit (when it has one), values (the strings it may hold, or a code: meaning
# map), formerly (names it was recorded under before, newest first), required (every rig's row
# has it), description.

# BonsaiData_Trial columns every rig may write.
trialColumns:
  trialNumber:
    type: int
    required: true
    formerly: [TrialCnt]
    description: The trial's number in the experiment, from 1.
  target:
    type: string
    values: [Left, Right]
    formerly: [targetSide]
    description: The side that was right.
  choice:
    type: string
    values: [Left, Right, NoResponse]
    formerly: [response]
    description: The side the mouse chose.
  outcome:
    type: string
    required: true
    values: [Correct, Incorrect, NoResponse]
    description: The trial's result.
  stimulusOnsetTime:
    type: double
    unit: s
    formerly: [stimulusOnsetSeconds]
    description: Harp time the workflow commanded the stimulus on, the marker that ties hardware events to the trial. The physical onset is in the hardware logs.
  choiceTime:
    type: double
    unit: s
    description: Harp time of the lick the workflow counted as the choice; NaN on NoResponse.
  rewardSizeUl:
    type: double
    unit: ul
    formerly: [rewardSize]
    description: Microlitres a reward on this trial gives. What was delivered is RewardDelivered in BonsaiData_Async.
  Seconds:
    type: double
    unit: s
    required: true
    description: Harp time the row was stamped (the Seconds of the Timestamped record LogTrial receives), when the outcome is known.

# Each kind of rig. repos: the workflow repositories that run on it (check-bonsai finds a
# workflow's rig by its repository's name). profiles: rig-setup's profiles for it.
rigs:
  behaviour-box:
    repos: [coen-behaviour-box]
    profiles: [rig-behaviour-box]
    devices:
      BehaviorBoard: [Main]
      Camera: [Box]
    # rig.yml keys that are not devices.
    settings: [rootPath, rigId]
    # Logs that are not devices or BonsaiData_Trial/BonsaiData_Async.
    streams: []
    experimentSettings:
      RunLengthMins: How long the experiment runs, in minutes.
      ExposureTime: Camera exposure, in microseconds.
      Gain: Camera gain, in dB.
    trialColumns: {}

  av-dome:
    repos: [av-dome]
    profiles: [rig-av-dome]
    devices:
      BehaviorBoard: [Main]
      TimestampGeneratorGen3: [Main]
      StepperDriver: [A, B]
      LicketySplit: [Left, Right]
      Camera: [Face, Pupil, Body]
    settings: [rootPath, rigId, interPulseInterval, lickSpoutDefaultPosition, projectionCalibration, speakerArray, zapit]
    streams: [Zapit, RigSchema, TaskSchema, TaskConfig, ValveCalibrationDO1, ValveCalibrationDO2, RenderHeartbeat, ResponseEvents, TrialStartEvents]
    experimentSettings:
      TrainingStage: Row of the task file's trainingStages to run.
      TaskFile: The task file, in the repository's config folder.
      RewardSizeUl: Reward size in microlitres for every stage; blank keeps the task file's.
      ItiMin: Shortest inter-trial interval in seconds; blank keeps the task file's.
      ItiMax: Longest inter-trial interval in seconds; blank keeps the task file's.
      Zapit: Optogenetics on or off.
      StepSize: Stepper step size for the spout nudges.
    trialColumns:
      trialType:
        type: int
        values: {0: Visual, 1: Audio, 2: AVCoherent, 3: AVConflict, 4: Neutral}
        description: The kind of trial, as InitialiseTrial.cs draws it.
      bothSpouts:
        type: bool
        formerly: [BothSpouts]
        description: True when both spouts were offered (otherwise only the correct one).
      largeReward:
        type: bool
        description: True when this trial's reward is the large one.
      repeatCount:
        type: int
        description: How many times in a row the trial has been repeated, 0 for a new draw.
      itiSeconds:
        type: double
        unit: s
        formerly: [itiDuration]
        description: Gap from this trial's outcome to the next trial, plus the error timeout after an error.
      visualAzimuth:
        type: double
        unit: deg
        description: Grating azimuth.
      visualElevation:
        type: double
        unit: deg
        description: Grating elevation.
      visualContrast:
        type: double
        description: Grating contrast, 0 to 1.
      visualPhase:
        type: double
        unit: rad
        description: Grating phase.
      audioAzimuth:
        type: double
        unit: deg
        description: Azimuth of the speaker that played, after snapping to the nearest wired one.
      audioElevation:
        type: double
        unit: deg
        description: Elevation of the speaker that played.
      audioWaveformIndex:
        type: int
        description: Index into the auditory stimulus set (calibration\AuditoryStimuli).
      optoStimulated:
        type: bool
        description: True when this trial had optogenetic stimulation.
      optoCondition:
        type: int
        description: The Zapit condition stimulated, 0 when none.
