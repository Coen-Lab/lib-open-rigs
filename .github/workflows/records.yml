# The records this repo owns, checked on every push to main and daily: fixtures\manifest\v3 and
# fixtures\experiment-folder\v1 are what OpenRigs.Manifest writes and reads. The check is the package's
# own console program, which needs only the .NET SDK and git; it starts no Bonsai. The other lab
# packages' console checks (Control, HarpDevices, LiveView) run here too: OpenRigs.yml's dotnet test
# skips console programs.

name: Records

on:
  push:
    branches: [main]
  schedule:
    - cron: "57 5 * * *"
  workflow_dispatch:

concurrency:
  group: records-${{ github.ref }}

permissions:
  contents: read

jobs:
  manifest:
    # net472: the framework Bonsai loads the package under.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project src\OpenRigs.Manifest.Tests
      - run: dotnet run --project src\OpenRigs.Control.Tests
      - run: dotnet run --project src\OpenRigs.HarpDevices.Tests
      - run: dotnet run --project src\OpenRigs.LiveView.Tests
